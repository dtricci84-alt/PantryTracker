name: Build PantryTracker APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Configure Android SDK path
        working-directory: PantryTrackerV1_3/PantryTrackerV1_3
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: PantryTrackerV1_3/PantryTrackerV1_3
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PantryTracker-v1.4-debug-apk
          path: PantryTrackerV1_3/PantryTrackerV1_3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
